name: Analyze & Test

# Every push. Nothing is built, signed or released here: release.yml owns that
# and still only fires on a version tag. This is so a change can be checked
# without shipping it, which matters because there is no Flutter SDK on the
# machine this app is written on and CI is the first compiler it ever meets.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
